[[feature]]
id = "feature/sim-music/midi-notation-workflows"
title = "MIDI and notation workflows"
summary = "Lift, realize, lower, inspect, and export musical material across bounded lossless MIDI files, exact tempo/pedal/note timelines, live MIDI fixtures, LilyPond, and MusicXML."
owner = "crate/sim-lib-midi-core"
audiences = ["user", "code", "framework"]
guidance = "Use this row when moving a musical phrase between MIDI events, Standard MIDI Files, notation, streams, and SIM music descriptors. Reuse sim-lib-midi-smf for bounded import and canonical export: it preserves formats 0, 1, and 2, keeps format-2 track time origins and tempo maps independent, retains metrical and valid SMPTE divisions plus unknown valid meta/system events, and reports malformed or oversized input at absolute byte offsets. Reuse sim-lib-midi-core MidiTempoMap for exact tick, quarter-beat, and wall-time conversion over the generic stream-clock chart. Reuse sim-lib-music-lift MidiRealizationPolicy for explicit FIFO/LIFO/reject overlap pairing, same-tick ordering, dangling-note behavior, sustain/sostenuto and channel-mode realization, identity-bearing notes, and multiplicity-preserving exact note slices. Reuse sim-lib-music-notation for the LilyPond subset and bounded MusicXML 4.0 score-partwise profile: the latter rejects DTDs, entity declarations, unknown extensions, and configured byte/node/depth/text/part/event overruns; retains stable part/event ids in an exchange sidecar; and reports every accepted loss while continuing to use canonical Score and its existing read-construct. Callers that need one performance timeline must select a format-2 pattern explicitly and must install an explicit real-time adapter before converting SMPTE timing to a metrical MIDI stream."
claims_anchors = [
  "anchor/crate/sim-lib-midi-ble",
  "anchor/crate/sim-lib-midi-core",
  "anchor/crate/sim-lib-midi-live",
  "anchor/crate/sim-lib-midi-rtmidi",
  "anchor/crate/sim-lib-midi-shapes",
  "anchor/crate/sim-lib-midi-smf",
  "anchor/crate/sim-lib-midi-sysex",
  "anchor/crate/sim-lib-midi-wasm-frame",
  "anchor/crate/sim-lib-music-notation",
  "anchor/crate/sim-lib-stream-file",
  "anchor/crate/sim-lib-stream-midi",
  "anchor/runtime-lib/sim-lib-midi-ble/midi-ble-lib",
  "anchor/runtime-lib/sim-lib-midi-core/midi-digest-lib",
  "anchor/runtime-lib/sim-lib-midi-core/midi-io-lib",
  "anchor/runtime-lib/sim-lib-midi-live/midi-live-lib",
  "anchor/runtime-lib/sim-lib-midi-rtmidi/midi-rtmidi-lib",
  "anchor/runtime-lib/sim-lib-midi-shapes/midi-shapes-lib",
  "anchor/runtime-lib/sim-lib-music-notation/music-notation-lib",
]
claims_surfaces = [
  "docs/sim-music/generated",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-midi-core/src/tests",
  "spec-test/sim-music/crates/sim-lib-midi-smf/src/tests",
  "spec-test/sim-music/crates/sim-lib-music-lift/src/tests",
  "spec-test/sim-music/crates/sim-lib-music-notation/src/tests",
]

[[feature]]
id = "feature/sim-music/pitch-and-sound-vocabulary"
title = "Pitch and sound vocabulary"
summary = "Name chords, build deterministic voicing palettes, generate bounded tetrachord scales, rank exact ratio intervals, walk pitch-set graphs, and describe timbres, spectra, and tuning facts through worked musical descriptors and bounded families."
owner = "crate/sim-lib-pitch-core"
audiences = ["user", "code", "framework"]
guidance = "Use this row when reusing pitch, chord, scale, pitch-set, exact ratio interval, tuning, timbre, spectrum, and dissonance vocabulary. Build chord voicing palettes through sim-lib-pitch-chord so exact pitch-vector duplicates are removed while first-policy order and stable ids remain available to downstream voice leading. Keep canonical pitch identity in the 12-class pitch types, generate tetrachord-derived scales through sim-lib-pitch-scale with SearchControl-bounded order/result/seed evidence, preserve the w/x/y/z scale fixtures as named third-stack facts, keep numeric pitch-set normalization separate from conventional SetEquivalence classification, use pitch-set interval/gap forms with an explicit zero-gap multiplicity policy, build jumping and non-jumping pitch-set neighborhoods as discrete graphs under SearchControl, use existing pitch-namer registries for symmetric-root proof cases before adding naming behavior, use sim-lib-pitch-ratio for reduced positive ratio identity, octave equivalence, prime-limit factor vectors, cents/error reports, exact discrete mixed-radix rank/unrank, SearchControl-bounded ratio approximation, root-declared exact chord interval matrices, generalized-mean chord costs with opt-in legacy no-division dialect, coverage summaries, and cycle-safe ratio relation trees, use OctaveSpace helpers for parameterized floor folding and circular distance, use tuning crates for frequency conversion, use tagged sound-core partials for source/harmonic/undertone tone components, use sound-timbre for harmonic and undertone expansion, root-normalized sampled timbres, caller-owned bounded timbre caches, explicit layer merge policy, and SearchControl-bounded timbre-family enumeration, use sound-render for PCM previews, and use the dissonance crates for typed Sonance results with named roughness mass, normalized density, harmonic context, normalization, aggregation, provenance, explicit interval-difference and merge modes, compatibility-only legacy tritone dialects, checked psychoacoustic curve families, partial-pair roughness, non-finite or inaudible-partial policy reports, SearchControl-bounded sonance fitting with training/validation/locked conformance corpus hashes and objective receipts, and contextual sonance comparisons with retained duplicate notes, input ids, voice continuity, commonality, leading, motion, pseudo-partial, interval-vector, and experimental exact-ratio components."
claims_anchors = [
  "anchor/crate/sim-lib-pitch-chord",
  "anchor/crate/sim-lib-pitch-core",
  "anchor/crate/sim-lib-pitch-dissonance",
  "anchor/crate/sim-lib-pitch-namer",
  "anchor/crate/sim-lib-pitch-namer-forte",
  "anchor/crate/sim-lib-pitch-namer-jazz",
  "anchor/crate/sim-lib-pitch-namer-riemann",
  "anchor/crate/sim-lib-pitch-namer-roman",
  "anchor/crate/sim-lib-pitch-ratio",
  "anchor/crate/sim-lib-pitch-scale",
  "anchor/crate/sim-lib-pitch-set",
  "anchor/crate/sim-lib-pitch-shapes",
  "anchor/crate/sim-lib-pitch-wasm-frame",
  "anchor/crate/sim-lib-sound-core",
  "anchor/crate/sim-lib-sound-dissonance",
  "anchor/crate/sim-lib-sound-gm",
  "anchor/crate/sim-lib-sound-shapes",
  "anchor/crate/sim-lib-sound-spectrum",
  "anchor/crate/sim-lib-sound-timbre",
  "anchor/crate/sim-lib-sound-tuning",
  "anchor/crate/sim-lib-sound-wasm-frame",
  "anchor/runtime-lib/sim-lib-pitch-dissonance/pitch-dissonance-lib",
  "anchor/runtime-lib/sim-lib-pitch-namer/pitch-namer-lib",
  "anchor/runtime-lib/sim-lib-pitch-shapes/pitch-shapes-lib",
  "anchor/runtime-lib/sim-lib-sound-dissonance/sound-dissonance-lib",
  "anchor/runtime-lib/sim-lib-sound-shapes/sound-shapes-lib",
  "anchor/runtime-lib/sim-lib-sound-timbre/sound-timbre-lib",
  "anchor/runtime-lib/sim-lib-sound-tuning/sound-tuning-lib",
]
claims_surfaces = [
  "docs/sim-music/generated",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-pitch-core/src/tests",
]

[[feature]]
id = "feature/sim-music/exact-music-analysis-and-transform"
title = "Exact music analysis and transform"
summary = "Convert exact score forms with loss and identity evidence, find certified voice-leading paths, and transform exact progressions with audited articulation, register, rhythm, and pitch operations."
owner = "crate/sim-lib-music-analysis"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a caller needs exact score time; policy-controlled conversion among melody, chord, identity-bearing staff, counterpoint, piano roll, snapshot, change stream, and progression; certified minimum-cost voice leading with explicit entrance, departure, doubling, crossing, norm, deterministic-tie, and path policy; exact progression duration multiplication, overlay, slicing, repetition, sustain, slur, expansion, delayed-note separation, register unwrapping, sequence/parallel composition, or rhythm masks; music analysis; lift/lower; notation; or partial pitch maps. Voice leading delegates optimization and certificate verification to sim-lib-discrete-graph rather than carrying a music-specific permutation or Hungarian copy. Conversion and transform reports retain or explicitly derive voice/note/event ids, enumerate every unrepresentable fact or repeated identity, and keep all time rational. Pitch maps report holes, nudge policies, direct inverses, and lossy composition witnesses."
claims_anchors = [
  "anchor/crate/sim-lib-music-analysis",
  "anchor/crate/sim-lib-music-combinators",
  "anchor/crate/sim-lib-music-core",
  "anchor/crate/sim-lib-music-lift",
  "anchor/crate/sim-lib-music-lower",
  "anchor/crate/sim-lib-music-notation",
  "anchor/crate/sim-lib-music-shapes",
  "anchor/crate/sim-lib-music-transform",
  "anchor/crate/sim-lib-music-wasm-frame",
  "anchor/runtime-lib/sim-lib-music-lift/music-lift-lib",
  "anchor/runtime-lib/sim-lib-music-notation/music-notation-lib",
  "anchor/runtime-lib/sim-lib-music-shapes/music-shapes-lib",
]
claims_surfaces = [
  "docs/sim-music/generated",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-music-analysis/src/tests",
  "spec-test/sim-music/crates/sim-lib-music-core/src/tests/score",
  "spec-test/sim-music/crates/sim-lib-music-transform/src/tests/exact",
  "spec-test/sim-music/crates/sim-lib-music-transform/src/tests/remap",
]

[[feature]]
id = "feature/sim-music/audio-lift-and-render"
title = "Audio lift and render workflows"
summary = "Lift PCM audio into sound features, reuse spectral summaries, and render finite sound buffers or WAV/SMF stream files through current sound libraries."
owner = "crate/sim-lib-sound-audio-lift"
audiences = ["user", "code", "framework"]
guidance = "Use this row when analyzing audio features, routing audio lift results toward music analysis, or rendering offline buffers. Reuse sound-audio-lift for PCM feature extraction, sound-spectrum for descriptors, sound-render for buffers and WAV output, and stream bridge/file crates for interchange."
claims_anchors = [
  "anchor/crate/sim-lib-sound-audio-lift",
  "anchor/crate/sim-lib-sound-bridge",
  "anchor/crate/sim-lib-sound-render",
  "anchor/crate/sim-lib-stream-bridge",
  "anchor/runtime-lib/sim-lib-sound-audio-lift/sound-audio-lift-lib",
  "anchor/runtime-lib/sim-lib-sound-bridge/sound-bridge-lib",
  "anchor/runtime-lib/sim-lib-sound-render/sound-render-lib",
  "anchor/runtime-lib/sim-lib-stream-bridge/stream-bridge-lib",
