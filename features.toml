[[feature]]
id = "feature/sim-music/pitch-and-sound-vocabulary"
title = "Pitch and sound vocabulary"
summary = "Name chords, build deterministic voicing palettes, generate bounded tetrachord scales, rank exact ratio intervals, walk pitch-set graphs, and describe timbres, spectra, and tuning facts through worked musical descriptors and bounded families."
owner = "crate/sim-lib-pitch-core"
audiences = ["user", "code", "framework"]
guidance = "Use this row when reusing pitch, chord, scale, pitch-set, exact ratio interval, tuning, timbre, spectrum, and dissonance vocabulary. Build chord voicing palettes through sim-lib-pitch-chord so exact pitch-vector duplicates are removed while first-policy order and stable ids remain available to downstream voice leading. Keep canonical pitch identity in the 12-class pitch types, generate tetrachord-derived scales through sim-lib-pitch-scale with SearchControl-bounded order/result/seed evidence, preserve the w/x/y/z scale fixtures as named third-stack facts, keep numeric pitch-set normalization separate from conventional SetEquivalence classification, use pitch-set interval/gap forms with an explicit zero-gap multiplicity policy, build jumping and non-jumping pitch-set neighborhoods as discrete graphs under SearchControl, use existing pitch-namer registries for symmetric-root proof cases before adding naming behavior, use sim-lib-pitch-ratio for reduced positive ratio identity, octave equivalence, prime-limit factor vectors, cents/error reports, exact discrete mixed-radix rank/unrank, SearchControl-bounded ratio approximation, root-declared exact chord interval matrices, generalized-mean chord costs with opt-in legacy no-division dialect, coverage summaries, and cycle-safe ratio relation trees, use OctaveSpace helpers for parameterized floor folding and circular distance, use tuning crates for frequency conversion, use tagged sound-core partials for source/harmonic/undertone tone components, use sound-timbre for harmonic and undertone expansion, root-normalized sampled timbres, caller-owned bounded timbre caches, explicit layer merge policy, and SearchControl-bounded timbre-family enumeration, use sound-render for PCM previews, and use the dissonance crates for typed Sonance results with named roughness mass, normalized density, harmonic context, normalization, aggregation, provenance, explicit interval-difference and merge modes, compatibility-only legacy tritone dialects, checked psychoacoustic curve families, partial-pair roughness, non-finite or inaudible-partial policy reports, SearchControl-bounded sonance fitting with training/validation/locked conformance corpus hashes and objective receipts, and contextual sonance comparisons with retained duplicate notes, input ids, voice continuity, commonality, leading, motion, pseudo-partial, interval-vector, and experimental exact-ratio components."
claims_anchors = [
  "anchor/crate/sim-lib-pitch-chord",
  "anchor/crate/sim-lib-pitch-core",
