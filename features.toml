[[feature]]
id = "feature/sim-music/exact-score-consonance"
title = "Exact score sounding windows and consonance"
summary = "Slice canonical scores and realized MIDI into identity-bearing half-open sounding windows and inspect pitch, acoustic, ratio, commonality, and leading metrics separately."
owner = "crate/sim-lib-music-consonance"
audiences = ["user", "code", "framework"]
guidance = "Use sim-lib-music-consonance when analysis must retain exact rational onsets/releases, duplicate pitches, voice/note/event ids, velocity, channel, articulation, and source provenance across a complete score timeline. Evaluate canonical Score or Staff values directly; use the realized-MIDI entry point after sim-lib-music-lift has applied overlap, pedal, same-tick, and dangling-note policy. Pitch-set models, acoustic curve models, exact-ratio context, commonality, and voice leading remain independently named MetricReport values. Roughness mass is never substituted for normalized density, and the report deliberately supplies no implicit scalar average."
claims_anchors = [
  "anchor/crate/sim-lib-music-consonance",
  "anchor/runtime-lib/sim-lib-music-consonance/music-consonance-lib",
]
claims_surfaces = [
  "docs/sim-music/generated",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-music-consonance/src/tests",
]
supports = [
  "feature/sim-music/exact-music-analysis-and-transform",
  "feature/sim-music/midi-notation-workflows",
  "feature/sim-music/pitch-and-sound-vocabulary",
]

[[feature]]
id = "feature/sim-music/reversible-consonance-completion"
title = "Reversible additive consonance completion"
summary = "Search typed note, ornament, chord, pedal, doubling, and voice additions under explicit metric and style bounds, returning an exactly removable content-bound patch."
owner = "crate/sim-lib-music-consonance"
audiences = ["user", "code", "framework"]
guidance = "Use complete_staff when existing identity-bearing material must remain immutable while a bounded search proposes additive consonance material. Supply deterministic candidates, named per-window MetricThreshold values, protected ids and spans, pitch ranges, StyleConstraints, and sim-lib-discrete-search SearchControl. CompletionResult retains before/after ConsonanceReport values, exact changed windows, selected-candidate and identity provenance, and the unmodified SearchReceipt, including Partial or Cancelled status. ConsonancePatch is bound to the source Staff content id; apply_patch only adds, while remove_patch fails closed on altered additions and restores every original voice/note/event id exactly."
claims_anchors = [
  "anchor/crate/sim-lib-music-consonance",
  "anchor/crate/sim-lib-music-transform",
]
claims_surfaces = [
  "docs/sim-music/generated",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-music-consonance/src/completion_tests",
]
supports = [
  "feature/sim-music/exact-music-analysis-and-transform",
  "feature/sim-music/exact-score-consonance",
]

