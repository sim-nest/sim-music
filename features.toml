[[route]]
id = "route/analyze-metrical-patterns"
task = "Quantize, compare, and discover repeated musical patterns"
audiences = ["user", "code", "framework"]
steps = [
  { feature = "feature/sim-music/exact-music-analysis-and-transform", why = "Music analysis supplies exact tempo/meter lattices, named feature extractors, invariance transforms, identity-bearing occurrences, support, and overlap policy while delegating DTW/search to sim-discrete and correlation to sim-numbers." },
  { specimen = "recipe/sim-music/crates/sim-lib-music-analysis/01-basics/metrical-similarity-pattern", why = "The checked descriptor states the straight/swing/tuplet quantization, DTW/correlation similarity, and bounded exact-verification contract." },
]

[[feature]]
id = "feature/sim-music/carpet-composition"
title = "Rank-addressed music carpets and relative forms"
summary = "Compose exact music on finite named axes with sparse cells, algebraic layout transforms, shared mixed-radix addresses, and loss-audited relative pitch/time encodings."
owner = "crate/sim-lib-music-combinators"
audiences = ["user", "code", "framework"]
guidance = "Use MusicCarpet when exact Music values need a finite multidimensional composition layout without introducing another score or matrix type. CarpetPolicy makes empty, ragged, and out-of-range behavior explicit; CarpetAxis marks cyclic dimensions; overlay, rotate, reflect, and slice carry explicit collision or boundary policy. rank_index and index_at_rank delegate stable cell ordinals to sim-lib-discrete-rank BoundedIntVectorSpace. apply_transform delegates musical edits to sim-lib-music-transform TransformChain. encode_relative and decode_relative support anchor- or previous-event pitch/time deltas at cell, carpet, or external scope. Retained origins round-trip canonical piano-roll values exactly; external origins and non-canonical source structures use the canonical music-core MusicConversion and ConversionLoss evidence."
claims_anchors = [
  "anchor/crate/sim-lib-music-combinators",
  "anchor/rustdoc/sim-lib-music-combinators/decode_relative",
  "anchor/rustdoc/sim-lib-music-combinators/encode_relative",
  "anchor/rustdoc/sim-lib-music-combinators/music-carpet",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-music-combinators/src/carpet_conformance",
  "spec-test/sim-music/crates/sim-lib-music-combinators/src/relative_conformance",
]
supports = [
  "feature/sim-music/exact-music-analysis-and-transform",
]

[[feature]]
id = "feature/sim-music/bounded-rewrite-catalogs"
title = "Bounded L-systems and ranked progression trees"
summary = "Derive context-aware musical grammars, scale-following pitch-map programs, and finite progression-tree catalogs with explicit bounds, shared rank/search, derivation trees, and receipts."
owner = "crate/sim-lib-music-combinators"
audiences = ["user", "code", "framework"]
guidance = "Use LSystem for finite parallel musical rewrites over a typed Alphabet. Every variable needs a non-empty context-free fallback, more-specific immediate-neighbor contexts take precedence, and ExpansionLimits plus bounded SearchControl are validated before sim-lib-discrete-search traversal starts. Derivation retains every generation, production child span, derivation forest, production counts, seed, and limits. Use ProgressionTreeCatalog when a fixed finite preorder topology has values from a finite catalog: rank and unrank delegate to sim-lib-discrete-rank BoundedIntVectorSpace, while explore delegates prefix filtering, work, frontier, memory, cancellation, seed, and receipts to sim-lib-discrete-search. ScaleRewriteProgram keeps modulation choices as named ScaleFollowingState data whose explicit PitchMap is checked against the declared scale and covered by a stable program digest."
claims_anchors = [
  "anchor/rustdoc/sim-lib-music-combinators/derive",
  "anchor/rustdoc/sim-lib-music-combinators/lsystem",
  "anchor/rustdoc/sim-lib-music-combinators/progression-tree-catalog",
  "anchor/rustdoc/sim-lib-music-combinators/scale-rewrite-program",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-music-combinators/src/rewrite_conformance",
]
supports = [
  "feature/sim-music/exact-music-analysis-and-transform",
]

[[feature]]
id = "feature/sim-music/exact-score-consonance"
title = "Exact score sounding windows and consonance"
summary = "Slice canonical scores and realized MIDI into identity-bearing half-open sounding windows and inspect pitch, acoustic, ratio, commonality, and leading metrics separately."
owner = "crate/sim-lib-music-consonance"
audiences = ["user", "code", "framework"]
guidance = "Use sim-lib-music-consonance when analysis must retain exact rational onsets/releases, duplicate pitches, voice/note/event ids, velocity, channel, articulation, and source provenance across a complete score timeline. Evaluate canonical Score or Staff values directly; use the realized-MIDI entry point after sim-lib-music-lift has applied overlap, pedal, same-tick, and dangling-note policy. Pitch-set models, acoustic curve models, exact-ratio context, commonality, and voice leading remain independently named MetricReport values. Roughness mass is never substituted for normalized density, and the report deliberately supplies no implicit scalar average."
claims_anchors = [
  "anchor/crate/sim-lib-music-consonance",
