[[feature]]
id = "feature/sim-music/declarative-harmony"
title = "Declarative harmony palettes and rules"
summary = "Load chord palettes, cadence-template algebra, hard legality, weighted musical preferences, voicing changes, and render settings as inspectable expression data."
owner = "crate/sim-lib-pitch-chord"
audiences = ["user", "code", "framework"]
guidance = "Use sim-lib-pitch-chord HarmonyProgram when harmony vocabulary and policy must be editable without compiling Rust. ChordTemplate composes existing chord symbols, exact pitches, pitch classes, pitch sets, scale-degree maps, voicing policies, and exact ratio tones. ChordPalette materializes explicit, alternative, Cartesian-chain, and transposition algebra with deterministic deduplication. HarmonyRuleSet keeps prefix-safe hard constraints separate from weighted metrics and retains one evidence row per rule. Use sim-lib-music-combinators DeclarativeHarmonyResolver to compose the chord-local count, certified voice-leading, and exact-ratio measures with named PitchDissonanceRegistry and ContextualSonanceRegistry models. Use render_harmony_progression to produce canonical exact-time Progression values while retaining the full export profile. The named catalog Lisp fixtures cover the harmonizer and chord-cycle filter families, value equality, empty prefixes, scale windows, duplicate voices, fingering bounds, and organ/trumpet render settings."
claims_anchors = [
  "anchor/crate/sim-lib-music-combinators",
  "anchor/crate/sim-lib-pitch-chord",
  "anchor/crate/sim-lib-pitch-dissonance",
  "anchor/crate/sim-lib-pitch-ratio",
  "anchor/crate/sim-lib-pitch-scale",
  "anchor/crate/sim-lib-pitch-set",
]
claims_surfaces = [
  "docs/sim-music/generated",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-pitch-chord/src/harmony_conformance",
]
supports = [
  "feature/sim-music/exact-music-analysis-and-transform",
  "feature/sim-music/pitch-and-sound-vocabulary",
]

[[feature]]
id = "feature/sim-music/bounded-harmonization"
title = "Bounded local and global harmonization"
summary = "Plan legal chord progressions with exhaustive, factored-backtracking, certified layered-DP, or declared-heuristic beam strategies and inspectable receipts."
owner = "crate/sim-lib-pitch-chord"
audiences = ["user", "code", "framework"]
guidance = "Use sim-lib-pitch-chord HarmonizationRequest and plan_harmony when a domain-specific metric resolver is already available; use sim-lib-music-combinators harmonize to install the pitch-dissonance and contextual-sonance registries. Every strategy consumes the same ChordPalette, melody masks, and HarmonyRuleSet. RecursiveExhaustive and FactoredBacktracking delegate bounded traversal to sim-lib-discrete-search. LayeredDp constructs the exact legal-prefix DAG and returns the sim-lib-discrete-graph Bellman certificate; Beam records its width and caller-declared remaining-cost heuristic. HarmonizationReceipt preserves complete, partial, cancelled, and infeasible status; charged work; evaluated candidates; aggregated failed-rule facts; generic backend receipts; and proven-optimal evidence only when it exists. Use layered DP for bounded exact fixtures and beam for large palettes."
claims_anchors = [
  "anchor/crate/sim-lib-music-combinators",
  "anchor/crate/sim-lib-pitch-chord",
  "anchor/rustdoc/sim-lib-music-combinators/harmonize",
  "anchor/rustdoc/sim-lib-pitch-chord/harmonization-receipt",
  "anchor/rustdoc/sim-lib-pitch-chord/harmonization-request",
  "anchor/rustdoc/sim-lib-pitch-chord/plan_harmony",
]
claims_surfaces = [
  "docs/sim-music/generated",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-pitch-chord/src/harmonize_tests",
]
supports = [
  "feature/sim-music/declarative-harmony",
  "feature/sim-music/pitch-and-sound-vocabulary",
]

