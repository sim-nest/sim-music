[[feature]]
id = "feature/sim-music/twelve-tone-row-theory"
title = "Strict twelve-tone rows, complete families, and explicit matrices"
summary = "Validate canonical twelve-pitch rows, preserve all 48 P/I/R/RI aliases across symmetry reduction, and inspect convention-explicit coordinate-bearing matrices."
owner = "crate/sim-lib-pitch-serial"
audiences = ["user", "code", "framework"]
guidance = "Use sim-lib-pitch-serial when order matters across one exhaustive chromatic aggregate. ToneRow accepts exactly the twelve canonical sim-lib-pitch-core PitchClass values once, with membership and multiplicity delegated to sim-lib-serial-core's exhaustive aggregate validation. RowOperation is the normalized affine/reversal identity: P/R use x + addend and I/RI use -x + addend modulo twelve, with reversal selected by the family. ToneRow::apply is total and returns a strict RowForm through an invariant-preserving private path. ToneRow::rotate and ToneRow::try_permute_ordinals reuse validated OrdinalMap bijections from sim-lib-serial-core rather than spelling a second permutation validator. RowFamilySet preserves all 48 operation aliases in stable order and separately deduplicates equal ToneRow values, retaining each alias's distinct-form index when row symmetry collapses forms. RowMatrix retains its source and RowLabelConvention, exposes validated cell coordinates, P row and I column operations, and P/R/I/RI edge labels; render_data and render_ascii project that same matrix object. Use AffinePitchMap for x -> ax + b mod 12: the bijective multipliers M1, M5, M7, and M11 return strict rows, while non-bijective multipliers return ordered PitchReservoir values with named relaxed invariants instead of pretending to be ToneRow. Use try_partition when a row is divided into nonempty disjoint ordinal blocks that cover all twelve positions exactly once while preserving whether order is total, partial, or intentionally absent within and between blocks; use the resulting reports for partition similarity, interlocking, mosaics, aggregate coverage, and chord-free vertical collections. Use multiply_partitions when one partition block's interval content is projected onto another block's pitches: it returns a BlockProductReservoir with per-block provenance instead of collapsing that material into a false row identity. Keep RowOperation as provenance and derive RowLabel separately: FirstLastPitch labels P/I from the first class and R/RI from the last, while OperationIndex uses the normalized affine addend. Load PitchShapesLib for the pitch/ToneRow citizen and Shape adapter. The checked row-family-matrix Rust specimen and GATE-ROW tests use Schoenberg's Op. 25 values to prove every alias equation, symmetric reduction without alias loss, every matrix line against its operation, malformed aggregate refusal, operation/label disagreement, affine bijections, non-bijective reservoirs, and the row-partition/block-product analysis surface. Use pitch-set for unordered set projections and sim-discrete for enumeration or search; this crate owns neither."
claims_anchors = [
  "anchor/crate/sim-lib-pitch-serial",
]
claims_specimens = [
  "recipe/sim-music/crates/sim-lib-pitch-serial/01-basics/row-family-matrix",
  "recipe/sim-music/crates/sim-lib-pitch-serial/02-partitions/partition-mosaic",
]

[[feature]]
id = "feature/sim-music/serial-practice"
title = "Immutable serial plans and provenance"
summary = "Freeze row instances, row ordinals, roles, parent evidence, simultaneous groups, and precedence into one validated serial plan, then realize strict row statements without losing source identity."
owner = "crate/sim-lib-music-serial"
audiences = ["user", "code", "framework"]
guidance = "Use sim-lib-music-serial when twelve-tone or broader serial material must remain an immutable structural source instead of collapsing early into score order. A SerialPlan stores stable RowInstanceId and SerialEventId keys, references row content through OrdinalRef values, preserves row operations in pitch-serial RowForm values, and validates every reference at construction. EventPlacement uses explicit simultaneous groups so equal-onset sonorities stay grouped without a fabricated left-to-right chord order; independent temporal requirements live in the validated precedence DAG. SerialRole and SerialOrigin keep structural, derived, ornamental, and external material distinct, every event carries at least one StructuralLicense naming the structural reading that licenses its notes, and every non-structural event must carry explicit parent evidence. SerialPractice composes open Arc-backed PracticeRule components instead of a closed style enum, evaluates a named SerialReading (StructuralPlan, DeclaredRoles, or AllSounding), and returns an InvariantLedger with one inspectable entry per rule: expected fact, observed fact, evidence ids, explicit waiver, and preserved/relaxed/violated status. Use the built-in aggregate, order, repeats, doublings, simultaneity, row-mixing, foreign-material, and parameter-exhaustion rules when a caller needs explicit policy and relaxation receipts rather than a single strictness boolean. Use TechniquePlan with the public complete-horizontal, motivic-partition, vertical-block, interlocking-partition, melody/accompaniment, aggregate-rotation, and simultaneous-form deployers when a practice such as Schoenberg-style partitioned deployment must stay inspectable instead of becoming a privileged style mode; `schoenberg_partitioned()` is one ordinary public composition of those components. StrictRealizationContext supplies explicit register, duration, velocity, articulation, voice, rest, tie, octave displacement, and simultaneity policy; `realize_strict` remains the opt-in strict chromatic path only. Modal or caller-defined scale landing is a separate open adaptation surface and never silently claims strict twelve-tone aggregate identity. Render through render_serial_staff, render_serial_piano_roll, or render_serial_score when canonical music-core identity, equal-pitch multiplicity, and exact rational timing must be preserved. Construction, practice evaluation, deployment, and realization fail closed on malformed ids, missing rows, out-of-range ordinals, missing structural coverage, parent cycles, impossible MIDI placement, non-positive duration, invalid ties, and unsupported interlocking or simultaneous-form witnesses. Load MusicShapesLib for the narrow music/SerialPlan shape and text adapter; MIDI/audio lowering, transforms, search, and completion remain in their existing owners."
claims_anchors = [
