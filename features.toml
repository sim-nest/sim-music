]

[[feature]]
id = "feature/sim-music/reversible-consonance-completion"
title = "Reversible additive consonance completion"
summary = "Search typed note, ornament, chord, pedal, doubling, and voice additions under explicit metric and style bounds, returning an exactly removable content-bound patch."
owner = "crate/sim-lib-music-consonance"
audiences = ["user", "code", "framework"]
guidance = "Use complete_staff when existing identity-bearing material must remain immutable while a bounded search proposes additive consonance material. Supply deterministic candidates, named per-window MetricThreshold values, protected ids and spans, pitch ranges, StyleConstraints, and sim-lib-discrete-search SearchControl. CompletionResult retains before/after ConsonanceReport values, exact changed windows, selected-candidate and identity provenance, and the unmodified SearchReceipt, including Partial or Cancelled status. ConsonancePatch is bound to the source Staff content id; apply_patch only adds, while remove_patch fails closed on altered additions and restores every original voice/note/event id exactly."
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-music-consonance/src/completion_tests",
]
supports = [
  "feature/sim-music/exact-music-analysis-and-transform",
  "feature/sim-music/exact-score-consonance",
]

[[feature]]
id = "feature/sim-music/music-counterpoint"
title = "Exact counterpoint analysis and bounded generation"
summary = "Analyze existing voices, derive graph-backed stretto relations, and generate one or more analyzer-legal voices through a finite bounded CSP and reversible additions."
owner = "crate/sim-lib-music-counterpoint"
audiences = ["user", "code", "framework"]
guidance = "Use analyze_counterpoint for material that already exists: it converts through music-core's identity-bearing Staff, reuses exact consonance sounding windows for rational event alignment, and returns every motion and violation with source voices, note/event ids, exact spans, stable rule ids, and metric evidence. Species-one through species-four and open policies are ordinary RuleSet data over intervals, relative motion, range, crossing, overlap, duration, and dissonance preparation/resolution. Use generate_counterpoint when the cantus must remain fixed. It compiles exact-time voice-slot variables and finite range/sonance/cadence pitch domains, delegates prefix propagation, scoring, seed order, work/frontier/result bounds, and cancellation to sim-lib-discrete-search, retains the unmodified SearchReceipt plus explicit diversity counts, admits only results that pass analyze_counterpoint under the same rules, and materializes each generated voice through the existing content-bound reversible ConsonancePatch. Use stretto_graph only for bounded derived analysis candidates. It materializes original, retrograde, inversion, retrograde-inversion, transposition, and duration requests through sim-lib-music-transform, stores legal pairs in sim-lib-discrete-graph Graph, reuses connected_components, reports maximal pairwise-compatible cliques, chooses the largest normalized suffix/prefix relation for chains, and labels fusion as derived analysis rather than generation."
claims_anchors = [
  "anchor/crate/sim-lib-music-counterpoint",
  "anchor/runtime-lib/sim-lib-music-counterpoint/music-counterpoint-lib",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-music-counterpoint/src/tests",
]
supports = [
