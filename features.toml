[[feature]]
id = "feature/sim-music/synth-performance-workbench"
title = "Synth performance workbench"
summary = "Compose catalog synthesis, deterministic offline renders, bounded PCM interchange, and realtime graph previews without duplicating synth or DSP implementations."
owner = "crate/sim-lib-music-synth"
audiences = ["user", "code", "framework"]
guidance = "Use music-synth for oscillators, envelopes, subtractive voices, DX7 FM, and modeled modular instruments; use sound-timbre for additive partials, filtered timbres, Karplus-Strong, and compact FM pairs; use sound-render for deterministic offline f32 PCM, phase vocoding, loudness, and visible normalization reports; use sim-lib-stream-file for bounded channel mapping, PCM16 quantization, seeded dither, and canonical WAV bytes/streams; and use the sim-audio-daw audio graph, DSP processors, and live runner for realtime preview. Keep Table/Dir values and explicit handles at recipe boundaries, and keep callback work preallocated and free of locks or I/O."
claims_anchors = [
  "anchor/crate/sim-lib-music-synth",
  "anchor/crate/sim-lib-stream-file",
  "anchor/export/sim-lib-music-synth/view/component",
  "anchor/export/sim-lib-music-synth/view-instrument-dx7-editor",
  "anchor/export/sim-lib-music-synth/view-instrument-ps3300-editor",
  "anchor/export/sim-lib-music-synth/view-instrument-system55-editor",
  "anchor/export/sim-lib-music-synth/view-instrument-system700-editor",
  "anchor/runtime-lib/sim-lib-music-synth/audio-synth-lib",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-music-synth/src/tests/daw",
  "spec-test/sim-music/crates/sim-lib-music-synth/src/tests/reuse",
  "spec-test/sim-music/crates/sim-lib-sound-timbre/src/tests",
]

[[feature]]
id = "feature/sim-music/midi-notation-workflows"
title = "MIDI and notation workflows"
summary = "Lift, realize, lower, inspect, and export musical material across bounded lossless MIDI files, exact tempo/pedal/note timelines, live MIDI fixtures, LilyPond, and MusicXML."
owner = "crate/sim-lib-midi-core"
audiences = ["user", "code", "framework"]
guidance = "Use this row when moving a musical phrase between MIDI events, Standard MIDI Files, notation, streams, and SIM music descriptors. Reuse sim-lib-midi-core MidiPort for bounded provider-neutral discovery, byte-exact messages, explicit timestamp authority, and typed physical refusals; native BlueZ, RtMidi, ALSA, cfg, and FFI remain platform-capsule concerns. Reuse sim-lib-midi-smf for bounded import and canonical export: it preserves formats 0, 1, and 2, keeps format-2 track time origins and tempo maps independent, retains metrical and valid SMPTE divisions plus unknown valid meta/system events, and reports malformed or oversized input at absolute byte offsets. Reuse sim-lib-midi-core MidiTempoMap for exact tick, quarter-beat, and wall-time conversion over the generic stream-clock chart. Reuse sim-lib-music-lift MidiRealizationPolicy for explicit FIFO/LIFO/reject overlap pairing, same-tick ordering, dangling-note behavior, sustain/sostenuto and channel-mode realization, identity-bearing notes, and multiplicity-preserving exact note slices. Reuse sim-lib-music-notation for the LilyPond subset and bounded MusicXML 4.0 score-partwise profile. Callers that need one performance timeline must select a format-2 pattern explicitly and supply a real-time port before converting SMPTE timing to a metrical MIDI stream."
claims_anchors = [
  "anchor/crate/sim-lib-midi-ble",
  "anchor/crate/sim-lib-midi-core",
  "anchor/crate/sim-lib-midi-live",
  "anchor/crate/sim-lib-midi-rtmidi",
  "anchor/crate/sim-lib-midi-shapes",
  "anchor/crate/sim-lib-midi-smf",
  "anchor/crate/sim-lib-midi-sysex",
  "anchor/crate/sim-lib-midi-wasm-frame",
  "anchor/crate/sim-lib-music-notation",
  "anchor/crate/sim-lib-stream-midi",
  "anchor/runtime-lib/sim-lib-midi-ble/midi-ble-lib",
  "anchor/runtime-lib/sim-lib-midi-core/midi-digest-lib",
  "anchor/runtime-lib/sim-lib-midi-core/midi-io-lib",
  "anchor/runtime-lib/sim-lib-midi-live/midi-live-lib",
  "anchor/runtime-lib/sim-lib-midi-rtmidi/midi-rtmidi-lib",
  "anchor/runtime-lib/sim-lib-midi-shapes/midi-shapes-lib",
  "anchor/runtime-lib/sim-lib-music-notation/music-notation-lib",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-midi-core/src/tests",
  "spec-test/sim-music/crates/sim-lib-midi-smf/src/tests",
  "spec-test/sim-music/crates/sim-lib-music-lift/src/tests",
  "spec-test/sim-music/crates/sim-lib-music-notation/src/tests",
]

[[feature]]
id = "feature/sim-music/pitch-and-sound-vocabulary"
title = "Pitch and sound vocabulary"
summary = "Name chords, build deterministic voicing palettes, classify pitch-set relations, generate bounded tetrachord scales, rank exact ratio intervals, walk pitch-set graphs, and describe timbres, spectra, and tuning facts through worked musical descriptors and bounded families."
owner = "crate/sim-lib-pitch-core"
audiences = ["user", "code", "framework"]
guidance = "Use this row when reusing pitch, chord, scale, pitch-set, exact ratio interval, tuning, timbre, spectrum, and dissonance vocabulary. Build chord voicing palettes through sim-lib-pitch-chord so exact pitch-vector duplicates are removed while first-policy order and stable ids remain available to downstream voice leading. Keep canonical pitch identity in the 12-class pitch types, generate tetrachord-derived scales through sim-lib-pitch-scale with SearchControl-bounded order/result/seed evidence, preserve the w/x/y/z scale fixtures as named third-stack facts, keep numeric pitch-set normalization separate from conventional SetEquivalence classification, and use analyze_set_relations for typed exact Tn/TnI operators, T/TI canonical equivalence, inclusion, complements, interval vectors, and Z-relations. Use pitch-set interval/gap forms with an explicit zero-gap multiplicity policy, build jumping and non-jumping pitch-set neighborhoods as discrete graphs under SearchControl, use existing pitch-namer registries for symmetric-root proof cases before adding naming behavior, use sim-lib-pitch-ratio for reduced positive ratio identity, octave equivalence, prime-limit factor vectors, cents/error reports, exact discrete mixed-radix rank/unrank, SearchControl-bounded ratio approximation, root-declared exact chord interval matrices, generalized-mean chord costs with opt-in legacy no-division dialect, coverage summaries, and cycle-safe ratio relation trees, use OctaveSpace helpers for parameterized floor folding and circular distance, use tuning crates for frequency conversion, use tagged sound-core partials for source/harmonic/undertone tone components, use sound-timbre for harmonic and undertone expansion, root-normalized sampled timbres, caller-owned bounded timbre caches, explicit layer merge policy, and SearchControl-bounded timbre-family enumeration, use sound-render for PCM previews, and use the dissonance crates for typed Sonance results with named roughness mass, normalized density, harmonic context, normalization, aggregation, provenance, explicit interval-difference and merge modes, compatibility-only legacy tritone dialects, checked psychoacoustic curve families, partial-pair roughness, non-finite or inaudible-partial policy reports, SearchControl-bounded sonance fitting with training/validation/locked conformance corpus hashes and objective receipts, and contextual sonance comparisons with retained duplicate notes, input ids, voice continuity, commonality, leading, motion, pseudo-partial, interval-vector, and experimental exact-ratio components."
claims_anchors = [
  "anchor/crate/sim-lib-pitch-core",
  "anchor/crate/sim-lib-pitch-dissonance",
  "anchor/crate/sim-lib-pitch-namer",
  "anchor/crate/sim-lib-pitch-namer-forte",
  "anchor/crate/sim-lib-pitch-namer-jazz",
  "anchor/crate/sim-lib-pitch-namer-riemann",
  "anchor/crate/sim-lib-pitch-namer-roman",
  "anchor/crate/sim-lib-pitch-ratio",
  "anchor/crate/sim-lib-pitch-scale",
  "anchor/crate/sim-lib-pitch-set",
  "anchor/crate/sim-lib-pitch-shapes",
  "anchor/crate/sim-lib-pitch-wasm-frame",
  "anchor/crate/sim-lib-sound-core",
  "anchor/crate/sim-lib-sound-dissonance",
  "anchor/crate/sim-lib-sound-gm",
  "anchor/crate/sim-lib-sound-shapes",
  "anchor/crate/sim-lib-sound-timbre",
  "anchor/crate/sim-lib-sound-tuning",
  "anchor/crate/sim-lib-sound-wasm-frame",
  "anchor/runtime-lib/sim-lib-pitch-dissonance/pitch-dissonance-lib",
  "anchor/runtime-lib/sim-lib-pitch-namer/pitch-namer-lib",
  "anchor/runtime-lib/sim-lib-pitch-shapes/pitch-shapes-lib",
  "anchor/runtime-lib/sim-lib-sound-dissonance/sound-dissonance-lib",
  "anchor/runtime-lib/sim-lib-sound-shapes/sound-shapes-lib",
  "anchor/runtime-lib/sim-lib-sound-timbre/sound-timbre-lib",
  "anchor/runtime-lib/sim-lib-sound-tuning/sound-tuning-lib",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-pitch-core/src/tests",
]

[[feature]]
id = "feature/sim-music/declarative-harmony"
title = "Declarative harmony palettes and rules"
summary = "Load chord palettes, cadence-template algebra, hard legality, declared and learned weighted preferences, voicing changes, and render settings as inspectable expression data."
owner = "crate/sim-lib-pitch-chord"
audiences = ["user", "code", "framework"]
guidance = "Use sim-lib-pitch-chord HarmonyProgram when harmony vocabulary and policy must be editable without compiling Rust. ChordTemplate composes existing chord symbols, exact pitches, pitch classes, pitch sets, scale-degree maps, voicing policies, and exact ratio tones. ChordPalette materializes explicit, alternative, Cartesian-chain, and transposition algebra with deterministic deduplication. HarmonyRuleSet keeps prefix-safe hard constraints separate from weighted metrics and retains one evidence row per rule. Use fit_harmony_markov and LearnedTransitionResolver when a corpus-derived transition preference is useful: music owns the chord/key state adapter, sim-lib-numbers-stats owns generic finite counts and smoothing, and the metric remains an optional soft negative-log score with held-out and corpus evidence. Use sim-lib-music-combinators DeclarativeHarmonyResolver to compose the chord-local count, certified voice-leading, and exact-ratio measures with named PitchDissonanceRegistry and ContextualSonanceRegistry models. Use render_harmony_progression to produce canonical exact-time Progression values while retaining the full export profile. The named fixtures cover declarative harmonizers, hard/soft separation, generated CC0 transition provenance, value equality, empty prefixes, scale windows, duplicate voices, fingering bounds, and organ/trumpet render settings."
claims_anchors = [
  "anchor/crate/sim-lib-pitch-chord",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-pitch-chord/src/harmony_conformance",
  "spec-test/sim-music/crates/sim-lib-pitch-chord/src/harmony_markov_tests",
]
supports = [
  "feature/sim-music/exact-music-analysis-and-transform",
  "feature/sim-music/pitch-and-sound-vocabulary",
]

[[feature]]
id = "feature/sim-music/bounded-harmonization"
title = "Bounded local and global harmonization"
summary = "Plan legal chord progressions with exhaustive, factored-backtracking, certified layered-DP, or declared-heuristic beam strategies and inspectable receipts."
owner = "crate/sim-lib-pitch-chord"
audiences = ["user", "code", "framework"]
guidance = "Use sim-lib-pitch-chord HarmonizationRequest and plan_harmony when a domain-specific metric resolver is already available; use sim-lib-music-combinators harmonize to install the pitch-dissonance and contextual-sonance registries. Every strategy consumes the same ChordPalette, melody masks, and HarmonyRuleSet. RecursiveExhaustive and FactoredBacktracking delegate bounded traversal to sim-lib-discrete-search. LayeredDp constructs the exact legal-prefix DAG and returns the sim-lib-discrete-graph Bellman certificate; Beam records its width and caller-declared remaining-cost heuristic. HarmonizationReceipt preserves complete, partial, cancelled, and infeasible status; charged work; evaluated candidates; aggregated failed-rule facts; generic backend receipts; and proven-optimal evidence only when it exists. Use layered DP for bounded exact fixtures and beam for large palettes."
claims_anchors = [
  "anchor/rustdoc/sim-lib-music-combinators/harmonize",
  "anchor/rustdoc/sim-lib-pitch-chord/harmonization-receipt",
  "anchor/rustdoc/sim-lib-pitch-chord/harmonization-request",
  "anchor/rustdoc/sim-lib-pitch-chord/plan_harmony",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-pitch-chord/src/harmonize_tests",
]
supports = [
  "feature/sim-music/declarative-harmony",
  "feature/sim-music/pitch-and-sound-vocabulary",
]

[[feature]]
id = "feature/sim-music/exact-music-analysis-and-transform"
title = "Exact music analysis and transform"
summary = "Convert exact score forms with loss and identity evidence, decode harmonic sequences, quantize declared lattices, compare melody/rhythm features, discover bounded repeated patterns, find certified graph paths, and audit exact transforms."
owner = "crate/sim-lib-music-analysis"
audiences = ["user", "code", "framework"]
guidance = "Use this row when a caller needs exact score time; policy-controlled conversion among melody, chord, identity-bearing staff, counterpoint, piano roll, snapshot, change stream, and progression; key or chord decoding from chroma/features through built-in or declared HarmonicTemplate rows; metrical quantization against an exact tempo/meter lattice with explicit swing, tuplets, tolerance, alternatives, and onset edits; melody or rhythm comparison through named extractors with declared transposition/time-scale invariance; bounded repeated-pattern discovery with support and overlap policy; certified minimum-cost voice leading; canonical-triad Tonnetz analysis; exact progression operations; lift/lower; notation; or partial pitch maps. Quantization and similarity delegate global DTW to sim-lib-discrete-graph. Similarity also retains sim-lib-numbers-signal correlation geometry and normalization. Pattern discovery uses hash candidates only as a filter, exact-verifies candidate pairs through sim-lib-discrete-search, and returns stable event/occurrence identities, transforms, costs, memory admission, and an unmodified SearchReceipt. Harmonic adapters delegate normalized inference to sim-lib-numbers-stats. Graph paths retain certificates. Conversion and transform reports keep rational time and make every identity or loss explicit."
claims_anchors = [
  "anchor/crate/sim-lib-music-analysis",
  "anchor/crate/sim-lib-music-core",
  "anchor/crate/sim-lib-music-lift",
  "anchor/crate/sim-lib-music-lower",
  "anchor/crate/sim-lib-music-shapes",
  "anchor/crate/sim-lib-music-transform",
  "anchor/crate/sim-lib-music-wasm-frame",
  "anchor/runtime-lib/sim-lib-music-lift/music-lift-lib",
  "anchor/runtime-lib/sim-lib-music-shapes/music-shapes-lib",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-music-analysis/src/harmonic_tests",
  "spec-test/sim-music/crates/sim-lib-music-analysis/src/sequence_tests",
  "spec-test/sim-music/crates/sim-lib-music-analysis/src/tests",
  "spec-test/sim-music/crates/sim-lib-music-core/src/tests/score",
  "spec-test/sim-music/crates/sim-lib-music-transform/src/tests/exact",
  "spec-test/sim-music/crates/sim-lib-music-transform/src/tests/remap",
]

[[feature]]
id = "feature/sim-music/algorithm-foundry"
title = "Shape-ranked music algorithm foundry"
summary = "Execute a data recipe by selecting independently loaded MIDI, analysis, harmony, counterpoint, render, and optional preview stages through open Shape-ranked runtime registrations."
owner = "crate/sim-lib-music-analysis"
audiences = ["user", "code", "framework"]
guidance = "Load MusicAlgorithmPlanLib, then register each callable with register_algorithm_stage under music/algorithm-stage/<name>. Every provider must expose argument and result Shapes plus implementation, cost-class, deterministic, and provenance metadata. music/algorithm-plan validates finite work/result/seed control, selects the unique highest Shape match, checks every result, and returns trace plus intermediate values. Use the music-algorithm-foundry recipe for the complete SMF-to-analysis-to-layered-harmony-to-species-counterpoint-to-SMF/WAV application. Its alternate exhaustive harmonizer is selected by changing only plan data. Supply input and output through Table/Dir backends and codecs; add realtime preview only as a separately loaded stage whose caller-supplied target implements EvalFabric realize. A missing stage or mismatched Shape is an error and never enables a hidden fallback."
claims_anchors = [
