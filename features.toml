[[feature]]
id = "feature/sim-music/audio-lift-and-render"
title = "Audio lift and render workflows"
summary = "Lift PCM through bounded YIN/pYIN and polyphonic partial tracks, reconstructable framed Fourier analysis, tuning-anchored constant-Q and chroma profiles, spectral summaries, and finite sound or stream rendering."
owner = "crate/sim-lib-sound-audio-lift"
audiences = ["user", "code", "framework"]
guidance = "Use PitchTrackPlan with pitch_track for monophonic YIN or pYIN under explicit range, frame/tail, threshold, interpolation, voiced-probability, work, result, and seed policy; inspect every candidate, rejection, uncertainty bound, and source frame rather than treating the contour as certain. Use polyphonic_pitch_track or track_partials to extend the existing FFT-peak/harmonic-comb frames into bounded partial identities: the music adapter composes sim-lib-discrete-graph certified assignment and DTW rather than owning another optimizer, and retains birth/death/gap/crossing/jump/track/memory/work policy plus graph receipts. Use sound-audio-lift StftPlan when frame size, hop, analysis/synthesis windows, centering, padding, phase, normalization, overlap promise, and deterministic limits must survive review. Check ColaReport and use istft only when the pair is reconstructable; invalid window pairs return their failing report rather than being silently normalized. Use CqtPlan plus constant_q for bounded, variable-window FFT bins anchored to a selected Tuning, then ChromaPlan plus chroma for an explicit Sum, Mean, or Maximum octave fold and per-frame normalization. StftFrame::spectrum keeps the existing sound-spectrum peak, centroid, flatness, rolloff, and flux APIs over shared numbers-signal transforms. Use sound-render for buffers and WAV output, and stream bridge/file crates for interchange."
claims_anchors = [
  "anchor/crate/sim-lib-sound-audio-lift",
  "anchor/crate/sim-lib-sound-bridge",
  "anchor/crate/sim-lib-sound-render",
  "anchor/crate/sim-lib-sound-spectrum",
  "anchor/crate/sim-lib-stream-bridge",
  "anchor/runtime-lib/sim-lib-sound-audio-lift/sound-audio-lift-lib",
  "anchor/runtime-lib/sim-lib-sound-bridge/sound-bridge-lib",
  "anchor/runtime-lib/sim-lib-sound-render/sound-render-lib",
  "anchor/runtime-lib/sim-lib-stream-bridge/stream-bridge-lib",
]
claims_surfaces = [
  "docs/sim-music/generated",
]
claims_specimens = [
  "spec-test/sim-music/crates/sim-lib-sound-audio-lift/src/partial_track_tests",
  "spec-test/sim-music/crates/sim-lib-sound-audio-lift/src/pitch_fixture_tests",
  "spec-test/sim-music/crates/sim-lib-sound-audio-lift/src/pitch_track_tests",
  "spec-test/sim-music/crates/sim-lib-sound-audio-lift/src/tests",
  "spec-test/sim-music/crates/sim-lib-sound-audio-lift/src/transform_tests",
]
supports = [
  "feature/sim-music/sound-spectrum-adapter",
]

