  "crates/sim-lib-music-synth",
  "crates/sim-lib-midi-ble",
  "crates/sim-lib-midi-core",
  "crates/sim-lib-midi-live",
  "crates/sim-lib-midi-rtmidi",
  "crates/sim-lib-midi-shapes",
  "crates/sim-lib-midi-smf",
  "crates/sim-lib-midi-sysex",
  "crates/sim-lib-midi-wasm-frame",
  "crates/sim-lib-music-analysis",
  "crates/sim-lib-music-combinators",
  "crates/sim-lib-music-consonance",
  "crates/sim-lib-music-counterpoint",
  "crates/sim-lib-music-core",
  "crates/sim-lib-music-lift",
  "crates/sim-lib-music-lower",
  "crates/sim-lib-music-notation",
  "crates/sim-lib-music-serial",
  "crates/sim-lib-music-shapes",
  "crates/sim-lib-music-transform",
  "crates/sim-lib-music-wasm-frame",
  "crates/sim-lib-pitch-chord",
  "crates/sim-lib-pitch-core",
  "crates/sim-lib-pitch-dissonance",
  "crates/sim-lib-pitch-namer",
  "crates/sim-lib-pitch-namer-forte",
  "crates/sim-lib-pitch-namer-jazz",
  "crates/sim-lib-pitch-namer-riemann",
  "crates/sim-lib-pitch-namer-roman",
  "crates/sim-lib-pitch-ratio",
  "crates/sim-lib-pitch-scale",
  "crates/sim-lib-pitch-serial",
  "crates/sim-lib-pitch-set",
  "crates/sim-lib-pitch-shapes",
  "crates/sim-lib-pitch-wasm-frame",
  "crates/sim-lib-sound-audio-lift",
  "crates/sim-lib-sound-bridge",
  "crates/sim-lib-sound-core",
  "crates/sim-lib-sound-dissonance",
  "crates/sim-lib-sound-gm",
  "crates/sim-lib-sound-render",
  "crates/sim-lib-sound-shapes",
  "crates/sim-lib-sound-spectrum",
  "crates/sim-lib-sound-timbre",
  "crates/sim-lib-sound-tuning",
  "crates/sim-lib-sound-wasm-frame",
  "crates/sim-lib-stream-bridge",
  "crates/sim-lib-stream-file",
  "crates/sim-lib-stream-midi",
  "crates/sim-lib-daw-session",
  "recipes/music-algorithm-foundry",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
sim-lib-discrete-graph = { git = "https://github.com/sim-nest/sim-discrete", rev = "b7e2772fa0eb560ff2a0c67c65e98a176da49702" }
sim-lib-discrete-rank = { git = "https://github.com/sim-nest/sim-discrete", rev = "b7e2772fa0eb560ff2a0c67c65e98a176da49702" }
sim-lib-discrete-search = { git = "https://github.com/sim-nest/sim-discrete", rev = "0a037cc4d12294c90d323bb473aaeb7150127b2e" }
sim-lib-audio-dsp = { path = "../sim-audio-daw/crates/sim-lib-audio-dsp" }
sim-lib-audio-graph-core = { path = "../sim-audio-daw/crates/sim-lib-audio-graph-core" }
sim-lib-audio-graph-live = { path = "../sim-audio-daw/crates/sim-lib-audio-graph-live" }
sim-lib-numbers-signal = { git = "https://github.com/sim-nest/sim-numbers", rev = "c9e3cc7e2f52c44496a29973d359b64761d76b47" }
sim-lib-numbers-stats = { git = "https://github.com/sim-nest/sim-numbers", rev = "c9e3cc7e2f52c44496a29973d359b64761d76b47" }
sim-lib-plugin-core = { path = "../sim-audio-daw/crates/sim-lib-plugin-core" }
sim-lib-stream-audio = { path = "../sim-stream/crates/sim-lib-stream-audio" }
