[package]
name = "sim-lib-music-counterpoint"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Exact counterpoint analysis, graph-backed stretto, and bounded constraint generation."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[dependencies]
sim-cookbook = { version = "0.1.0" }
sim-kernel = { version = "0.1.0" }
sim-lib-core = { version = "0.1.0" }
sim-lib-discrete-graph = { version = "0.1.5" }
sim-lib-discrete-search = { version = "0.1.0" }
sim-lib-music-consonance = { version = "0.1.0", path = "../sim-lib-music-consonance" }
sim-lib-music-core = { version = "0.1.3", path = "../sim-lib-music-core" }
sim-lib-music-shapes = { version = "0.1.4", path = "../sim-lib-music-shapes" }
sim-lib-music-transform = { version = "0.1.4", path = "../sim-lib-music-transform" }
sim-shape = { version = "0.1.0" }
thiserror = "1"

[build-dependencies]
sim-cookbook = { version = "0.1.0" }

[dev-dependencies]
num-rational = "0.4"
sim-codec = { version = "0.1.0" }
sim-codec-lisp = { version = "0.1.0" }
sim-test-support = { version = "0.1.0" }

[lints]
workspace = true
