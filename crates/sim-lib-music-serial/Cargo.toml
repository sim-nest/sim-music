[package]
name = "sim-lib-music-serial"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Immutable serial plans with stable row and event identity, explicit provenance, and validated partial temporal order."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[dependencies]
sim-cookbook = { version = "0.1.0" }
sim-lib-discrete-search = { version = "0.1.1", path = "../../../sim-discrete/crates/sim-lib-discrete-search" }
sim-lib-music-core = { version = "0.1.3", path = "../sim-lib-music-core" }
sim-lib-pitch-core = { version = "0.1.0", path = "../sim-lib-pitch-core" }
sim-lib-pitch-serial = { version = "0.1.0", path = "../sim-lib-pitch-serial" }
thiserror = "1"

[build-dependencies]
sim-cookbook = { version = "0.1.0" }

[lints]
workspace = true
