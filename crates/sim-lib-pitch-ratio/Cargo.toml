[package]
name = "sim-lib-pitch-ratio"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
description = "Exact positive musical ratio intervals with prime-limit ranking and bounded approximation search."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[dependencies]
num-bigint = "0.4"
sim-cookbook = { version = "0.3.0" }
sim-lib-discrete-comb = { version = "0.3.0" }
sim-lib-discrete-search = { version = "0.2.0" }
thiserror = "1"

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[lints]
workspace = true
