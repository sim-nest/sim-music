[package]
name = "sim-lib-music-combinators"
version = "0.1.4"
edition = "2024"
license = "MPL-2.0"
description = "Composable melody, rhythm, arpeggio, bassline, and pattern-building helpers."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[dependencies]
sim-cookbook = { version = "0.3.0" }
sim-kernel = { version = "0.3.0" }
sim-lib-discrete-rank = { version = "0.2.0" }
sim-lib-discrete-search = { version = "0.2.0" }
sim-lib-music-core = { version = "0.3.0", path = "../sim-lib-music-core" }
sim-lib-music-transform = { version = "0.2.0", path = "../sim-lib-music-transform" }
sim-lib-pitch-chord = { version = "0.3.0", path = "../sim-lib-pitch-chord" }
sim-lib-pitch-dissonance = { version = "0.2.0", path = "../sim-lib-pitch-dissonance" }
sim-lib-pitch-namer = { version = "0.2.0", path = "../sim-lib-pitch-namer" }
sim-lib-pitch-scale = { version = "0.3.0", path = "../sim-lib-pitch-scale" }
sim-lib-sound-gm = { version = "0.2.0", path = "../sim-lib-sound-gm" }
sim-lib-rank = { version = "0.2.0" }
thiserror = "1"

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[dev-dependencies]
num-rational = "0.4"
