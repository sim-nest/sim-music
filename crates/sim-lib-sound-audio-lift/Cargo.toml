[package]
name = "sim-lib-sound-audio-lift"
version = "0.1.3"
edition = "2024"
license = "MPL-2.0"
description = "Lifts PCM and rendered audio artifacts into structured sound analysis descriptors."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[dependencies]
num-rational = "0.4"
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-core = { version = "0.2.0" }
sim-lib-discrete-graph = { version = "0.2.0" }
sim-lib-music-analysis = { version = "0.1.4", path = "../sim-lib-music-analysis" }
sim-lib-music-core = { version = "0.2.0", optional = true, path = "../sim-lib-music-core" }
sim-lib-numbers-signal = { version = "0.1.0" }
sim-lib-pitch-core = { version = "0.2.0", path = "../sim-lib-pitch-core" }
sim-lib-sound-core = { version = "0.2.0", path = "../sim-lib-sound-core" }
sim-lib-sound-spectrum = { version = "0.1.2", path = "../sim-lib-sound-spectrum" }
sim-lib-sound-tuning = { version = "0.2.1", path = "../sim-lib-sound-tuning" }
sim-shape = { version = "0.2.0" }
thiserror = "1"

[build-dependencies]
sim-cookbook = { version = "0.2.0" }

[dev-dependencies]
sim-codec = { version = "0.1.0" }
sim-codec-lisp = { version = "0.2.0" }
sim-lib-numbers-f64 = { version = "0.3.0" }

[features]
default = []
sound-music = ["dep:sim-lib-music-core"]

[lints]
workspace = true
