[package]
name = "sim-lib-midi-ble"
version = "0.1.5"
edition = "2024"
license = "MPL-2.0"
description = "BLE-MIDI discovery, packet framing, and stream-host placement seams."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[features]
default = ["model"]
# Marks the modeled (pure-Rust, no-FFI) capability tier; see the crate docs.
model = []

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.1" }
sim-lib-core = { version = "0.2.0" }
sim-lib-midi-core = { version = "0.1.5", path = "../sim-lib-midi-core" }
sim-lib-midi-rtmidi = { version = "0.1.7", path = "../sim-lib-midi-rtmidi" }
sim-lib-stream-host = { version = "0.1.7" }

[build-dependencies]
sim-cookbook = { version = "0.2.0" }

[dev-dependencies]
sim-test-support = { version = "0.1.0" }
sim-value = { version = "0.2.0" }

[lints]
workspace = true
