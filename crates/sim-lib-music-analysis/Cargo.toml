[package]
name = "sim-lib-music-analysis"
version = "0.1.3"
edition = "2024"
license = "MPL-2.0"
description = "Exact structural, harmonic, quantization, similarity, and pattern analysis over SIM music."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-lib-core = { version = "0.1.0" }
sim-lib-discrete-graph = { version = "0.2.0" }
sim-lib-discrete-search = { version = "0.1.0" }
sim-lib-discrete-spectral = { optional = true, version = "0.2.0" }
sim-lib-music-core = { version = "0.2.0", path = "../sim-lib-music-core" }
sim-lib-numbers-signal = { version = "0.1.0" }
sim-lib-numbers-stats = { version = "0.3.0" }
sim-lib-pitch-chord = { version = "0.2.0", path = "../sim-lib-pitch-chord" }
sim-lib-pitch-core = { version = "0.2.0", path = "../sim-lib-pitch-core" }
sim-lib-pitch-namer-riemann = { version = "0.2.0", path = "../sim-lib-pitch-namer-riemann" }
sim-lib-pitch-set = { version = "0.2.0", path = "../sim-lib-pitch-set" }
sim-shape = { version = "0.2.0" }
thiserror = "2"

[build-dependencies]
sim-cookbook = { version = "0.2.0" }

[dev-dependencies]
num-rational = "0.4"
sim-kernel = { version = "0.2.0", features = ["test-support"] }

[features]
default = []
discrete-fwht = ["dep:sim-lib-discrete-spectral"]
