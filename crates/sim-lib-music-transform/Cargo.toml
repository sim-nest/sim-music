[package]
name = "sim-lib-music-transform"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
description = "Pitch, time, pattern, and diagnostic transforms over canonical SIM music objects."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[dependencies]
num-rational = "0.4"
sim-cookbook = { version = "0.3.0" }
sim-kernel = { version = "0.3.0" }
sim-lib-discrete-graph = { version = "0.3.0" }
sim-lib-music-core = { version = "0.3.0", path = "../sim-lib-music-core" }
sim-lib-music-serial = { version = "0.2.0", path = "../sim-lib-music-serial" }
sim-lib-pitch-chord = { version = "0.3.0", path = "../sim-lib-pitch-chord" }
sim-lib-pitch-core = { version = "0.3.0", path = "../sim-lib-pitch-core" }
sim-lib-pitch-serial = { version = "0.2.0", path = "../sim-lib-pitch-serial" }
sim-lib-pitch-scale = { version = "0.3.0", path = "../sim-lib-pitch-scale" }
thiserror = "1"

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[dev-dependencies]
sim-lib-midi-core = { version = "0.2.0", path = "../sim-lib-midi-core" }
sim-lib-music-lower = { version = "0.2.0", path = "../sim-lib-music-lower" }
