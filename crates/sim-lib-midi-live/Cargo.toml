[package]
name = "sim-lib-midi-live"
version = "0.3.0"
edition = "2024"
license = "MPL-2.0"
description = "In-memory live MIDI session descriptors and ring-buffer transport models."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[dependencies]
sim-cookbook = { version = "0.4.0" }
sim-kernel = { version = "0.4.0" }
sim-lib-core = { version = "0.4.0" }
sim-lib-midi-core = { version = "0.3.0", path = "../sim-lib-midi-core" }
thiserror = "1"

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }
