[package]
name = "sim-lib-midi-shapes"
version = "0.4.0"
edition = "2024"
license = "MPL-2.0"
description = "Text codecs, citizen descriptors, and runtime shapes for MIDI events and files."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[dependencies]
sim-citizen = { version = "0.4.0" }
sim-citizen-derive = { version = "0.4.0" }
sim-codec = { version = "0.3.0" }
sim-cookbook = { version = "0.4.0" }
sim-kernel = { version = "0.4.0" }
sim-value = { version = "0.4.0" }
sim-lib-midi-core = { version = "0.3.0", path = "../sim-lib-midi-core" }
sim-lib-midi-smf = { version = "0.4.0", path = "../sim-lib-midi-smf" }
sim-shape = { version = "0.4.0" }
thiserror = "1"

[build-dependencies]
sim-cookbook-build = { version = "0.2.0" }

[dev-dependencies]
sim-kernel = { version = "0.4.0", features = ["test-support"] }
