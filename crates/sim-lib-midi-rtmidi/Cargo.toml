[package]
name = "sim-lib-midi-rtmidi"
version = "0.1.7"
edition = "2024"
license = "MPL-2.0"
description = "Modeled RtMidi MIDI adapter surface for SIM (in-process simulation; no live MIDI hardware I/O)."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-music"
homepage = "https://github.com/sim-nest/sim-music"

[features]
default = ["model"]
# Marks the modeled (pure-Rust, no-FFI) capability tier; see the crate docs.
model = []

[dependencies]
sim-cookbook = { version = "0.2.0" }
sim-kernel = { version = "0.2.1" }
sim-lib-core = { version = "0.2.0" }
sim-lib-midi-core = { version = "0.1.5", path = "../sim-lib-midi-core" }
sim-lib-stream-core = { version = "0.1.4" }
sim-lib-stream-host = { version = "0.1.7" }

[build-dependencies]
sim-cookbook-build = { version = "0.1.0" }

[dev-dependencies]
sim-value = { version = "0.2.0" }

[lints]
workspace = true
